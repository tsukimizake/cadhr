[package]
name = "cadhr-lang"
version = "0.1.0"
edition = "2024"

[lib]
name = "cadhr_lang"
path = "src/lib.rs"

[[bin]]
name = "cadhr-lang"
path = "src/main.rs"

[dependencies]
manifold-csg = "0.3"
stl_io = "0.11"
threemf = "0.8"
serde_json = "1"
num-rational = "0.4"
num-bigint = "0.4"
num-traits = "0.2"
chumsky = { version = "0.13", features = ["pratt"] }
ariadne = "0.6"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
approx = "0.5"
